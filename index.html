<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nama Kamu | Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050914;--bg2:#0a1226;--card:#0e1a35;--line:#1a2b52;
  --blue:#2f7bff;--cyan:#38bdf8;--text:#e8eefc;--mute:#8da2c8;--r:16px;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{
  font-family:'Plus Jakarta Sans',system-ui,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.6;
  overflow-x:hidden;position:relative;
}
a{color:inherit;text-decoration:none}
ul{list-style:none}
img{max-width:100%;display:block}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px;position:relative;z-index:2}
section{padding:80px 0;position:relative;overflow:hidden}
h2.title{font-size:clamp(1.7rem,4vw,2.4rem);font-weight:800;text-align:center;margin-bottom:44px;position:relative}
h2.title::after{
  content:"";display:block;width:64px;height:4px;margin:12px auto 0;border-radius:99px;
  background:linear-gradient(90deg,var(--blue),var(--cyan));
  transform:scaleX(0);transition:transform .8s var(--ease);
}
h2.title.show::after{transform:scaleX(1)}

/* Scroll Progress Bar */
#progressBar{
  position:fixed;top:0;left:0;height:3px;width:0%;z-index:100;
  background:linear-gradient(90deg,var(--blue),var(--cyan),#a78bfa);
  box-shadow:0 0 12px rgba(56,189,248,.8);
  transition:width .08s linear;
}

/* Cursor Spotlight */
#cursorGlow{
  position:fixed;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(520px circle at var(--mx,-500px) var(--my,-500px),rgba(47,123,255,.11),transparent 65%);
  transition:opacity .3s;
}

/* Button */
.btn{
  position:relative;overflow:hidden;display:inline-block;padding:12px 26px;border-radius:999px;
  background:linear-gradient(135deg,var(--blue),var(--cyan));color:#031024;
  border:0;cursor:pointer;font:inherit;font-weight:700;
  transition:transform .25s var(--ease),box-shadow .25s var(--ease);
}
.btn::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(120deg,transparent 20%,rgba(255,255,255,.35) 50%,transparent 80%);
  transform:translateX(-120%);transition:transform .6s var(--ease);
}
.btn:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(47,123,255,.45)}
.btn:hover::after{transform:translateX(120%)}
.btn:active{transform:translateY(-1px) scale(.98)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.ph{background:linear-gradient(135deg,var(--card),var(--bg2));display:grid;place-items:center;color:var(--mute);font-weight:700}

/* Nav */
header{
  position:fixed;inset:0 0 auto;z-index:50;
  background:rgba(5,9,20,.72);backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(26,43,82,.6);
  transition:background .3s,box-shadow .3s,border-color .3s;
}
header.scrolled{
  background:rgba(5,9,20,.92);
  border-bottom-color:var(--line);
  box-shadow:0 10px 30px rgba(0,0,0,.35);
}
nav{display:flex;justify-content:space-between;align-items:center;height:64px}
.brand{
  font-weight:800;font-size:1.2rem;
  background:linear-gradient(90deg,var(--cyan),var(--blue),var(--cyan));
  background-size:200% auto;-webkit-background-clip:text;color:transparent;
  animation:shimmer 6s linear infinite;
}
nav ul{display:flex;gap:28px}
nav ul a{
  position:relative;color:var(--mute);font-weight:500;padding:4px 0;
  transition:color .25s;
}
nav ul a::after{
  content:"";position:absolute;left:0;bottom:-2px;width:100%;height:2px;
  background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:2px;
  transform:scaleX(0);transform-origin:right;transition:transform .3s var(--ease);
}
nav ul a:hover,nav ul a.active{color:var(--text)}
nav ul a:hover::after,nav ul a.active::after{transform:scaleX(1);transform-origin:left}
#burger{display:none;background:none;border:0;color:var(--text);font-size:1.6rem;cursor:pointer}

/* Hero */
#home{
  padding-top:140px;min-height:100vh;display:flex;align-items:center;
  background:radial-gradient(700px 420px at 80% 30%,rgba(47,123,255,.22),transparent 70%);
}
.orb{
  position:absolute;border-radius:50%;filter:blur(80px);opacity:.32;pointer-events:none;z-index:0;
  animation:drift 14s ease-in-out infinite alternate;
}
.orb.o1{width:340px;height:340px;background:var(--blue);top:10%;left:-80px}
.orb.o2{width:300px;height:300px;background:var(--cyan);bottom:8%;right:-60px;animation-delay:-5s}

.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.hero h3{font-size:1.2rem;font-weight:500;color:var(--mute)}
.hero h1{
  font-size:clamp(2.2rem,6vw,3.8rem);font-weight:800;line-height:1.1;margin:6px 0 16px;
  background:linear-gradient(135deg,#fff 35%,var(--cyan) 100%);
  -webkit-background-clip:text;color:transparent;
}
.hero .role{font-size:clamp(1.5rem,4vw,2.4rem);font-weight:800;line-height:1.2;color:var(--cyan)}
.hero .role span{display:block}
.hero .role span:last-child::after{
  content:"|";margin-left:6px;color:var(--blue);
  animation:blink 1s steps(1) infinite;
}
.socials{display:flex;gap:10px;flex-wrap:wrap;margin:26px 0}
.socials a{
  padding:8px 16px;border:1px solid var(--line);border-radius:999px;font-size:.9rem;color:var(--mute);
  transition:transform .25s var(--ease),border-color .25s,color .25s,background .25s,box-shadow .25s;
}
.socials a:hover{
  transform:translateY(-3px);border-color:var(--cyan);color:var(--text);
  background:var(--card);box-shadow:0 6px 20px rgba(56,189,248,.22);
}

.photo{
  width:min(380px,100%);aspect-ratio:1;margin:auto;border-radius:50%;overflow:hidden;
  border:3px solid var(--blue);box-shadow:0 0 60px rgba(47,123,255,.35);
}
.photo img{width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease)}
.photo.ph{font-size:4rem}
.photo.pop{
  --pop:1.3;position:relative;overflow:visible;
  background:radial-gradient(circle at 50% 35%,#12306b,#07122a);
  animation:floatY 5.5s ease-in-out infinite,pulseGlow 4s ease-in-out infinite;
}
.photo.pop img{
  position:absolute;left:0;bottom:0;width:100%;height:calc(var(--pop)*100%);
  object-fit:contain;object-position:center bottom;
  clip-path:inset(0 round 0 0 50% 50% / 0 0 calc(50% / var(--pop)) calc(50% / var(--pop)));
  transition:transform .5s var(--ease);
}
.photo.pop:hover img{transform:scale(1.03)}

/* Hero initial staggered animation */
.hero-anim{opacity:0;transform:translateY(26px);animation:heroIn .85s var(--ease) forwards}
.hero-anim.d1{animation-delay:.08s}
.hero-anim.d2{animation-delay:.2s}
.hero-anim.d3{animation-delay:.34s}
.hero-anim.d4{animation-delay:.48s}
.hero-anim.d5{animation-delay:.6s}
.hero-photo-anim{opacity:0;transform:scale(.88) translateY(20px);animation:heroPhotoIn 1s var(--ease) .25s forwards}

/* About */
#about{background:var(--bg2)}
.about{display:grid;grid-template-columns:.8fr 1.2fr;gap:44px;align-items:center}
.about .photo{border-radius:var(--r);aspect-ratio:4/5;width:min(320px,100%);box-shadow:0 16px 40px rgba(0,0,0,.35)}
.about .photo:hover img{transform:scale(1.05)}
.about h2{font-size:clamp(1.7rem,4vw,2.4rem);font-weight:800;margin-bottom:14px}
.about p{color:var(--mute);margin-bottom:24px;max-width:60ch}
.about b{color:var(--cyan);font-weight:700}

/* Projects & Certificates */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px}
.card{
  position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;display:flex;flex-direction:column;
  transition:transform .35s var(--ease),border-color .35s,box-shadow .35s;
  transform-style:preserve-3d;will-change:transform;
}
.card::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:0;z-index:2;
  background:radial-gradient(320px circle at var(--cx,50%) var(--cy,50%),rgba(56,189,248,.16),transparent 60%);
  transition:opacity .35s;
}
.card:hover{border-color:rgba(56,189,248,.65);box-shadow:0 16px 38px rgba(4,12,32,.65),0 0 24px rgba(47,123,255,.16)}
.card:hover::before{opacity:1}
.card .img{aspect-ratio:16/10;overflow:hidden;position:relative}
.card .img img{width:100%;height:100%;object-fit:cover;transition:transform .55s var(--ease)}
.card:hover .img img{transform:scale(1.07)}
.card .body{padding:20px;display:flex;flex-direction:column;gap:6px;flex:1;position:relative;z-index:3}
.card .meta{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:.85rem}
.tag{background:rgba(47,123,255,.15);color:var(--cyan);padding:2px 12px;border-radius:999px;font-weight:600;border:1px solid rgba(56,189,248,.2)}
.card h3{font-size:1.15rem;transition:color .25s}
.card:hover h3{color:var(--cyan)}
.card p{font-size:.88rem;color:var(--mute);flex:1}
.card .btn{align-self:flex-start;margin-top:10px;padding:8px 20px;font-size:.9rem}
.card.cert .img{aspect-ratio:4/3;background:var(--bg2)}
.card.cert .img a{display:block;height:100%}
.card.cert .img img{object-fit:contain}

/* Experience */
.tabs{display:flex;justify-content:center;gap:10px;margin-bottom:36px}
.tabs button{
  padding:10px 26px;border-radius:999px;border:1px solid var(--line);background:none;
  color:var(--mute);font:inherit;font-weight:600;cursor:pointer;
  transition:transform .25s var(--ease),background .25s,border-color .25s,color .25s,box-shadow .25s;
}
.tabs button:hover{border-color:var(--cyan);color:var(--text)}
.tabs button.on{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 6px 20px rgba(47,123,255,.35)}
.timeline{max-width:760px;margin:0 auto;border-left:2px solid var(--line);padding-left:28px;display:grid;gap:18px}
.tl{
  position:relative;display:flex;gap:18px;align-items:flex-start;justify-content:space-between;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;
  transition:transform .3s var(--ease),border-color .3s,box-shadow .3s;
}
.tl:hover{transform:translateX(6px);border-color:var(--blue);box-shadow:0 12px 30px rgba(0,0,0,.35)}
.tl::before{
  content:"";position:absolute;left:-37px;top:26px;width:14px;height:14px;border-radius:50%;
  background:var(--blue);box-shadow:0 0 0 4px var(--bg2);
  transition:transform .3s var(--ease),background .3s,box-shadow .3s;
}
.tl:hover::before{transform:scale(1.3);background:var(--cyan);box-shadow:0 0 0 4px var(--bg2),0 0 14px var(--cyan)}
.tl .txt{flex:1;min-width:0}
.tl h3{font-size:1.1rem}
.tl h4{color:var(--cyan);font-weight:600;font-size:.95rem}
.tl .date{color:var(--mute);font-size:.85rem;margin:2px 0 8px}
.tl p{color:var(--mute);font-size:.92rem}
.tl .pic{flex:none;width:160px;aspect-ratio:1;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.tl .pic img{width:100%;height:100%;object-fit:cover;transition:transform .5s var(--ease)}
.tl:hover .pic img{transform:scale(1.08)}
[hidden]{display:none!important}
@media(max-width:820px){.tl .pic{width:96px}}

/* Offer / Skills */
#offer{background:var(--bg2)}
.offer{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px}
.box{
  position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px;
  transition:transform .35s var(--ease),border-color .35s,box-shadow .35s;
}
.box:hover{transform:translateY(-4px);border-color:rgba(56,189,248,.55);box-shadow:0 16px 36px rgba(0,0,0,.35)}
.box h3{font-size:1.4rem;margin-bottom:8px}
.box>p{color:var(--mute);margin-bottom:18px;font-size:.95rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips li{
  padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-size:.88rem;
  transition:transform .25s var(--ease),border-color .25s,color .25s,box-shadow .25s;
}
.chips li:hover{transform:translateY(-3px) scale(1.04);border-color:var(--cyan);color:var(--cyan);box-shadow:0 4px 14px rgba(56,189,248,.22)}

/* Testimonials */
.rail{display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 18px}
.rail .t{
  flex:0 0 min(340px,85%);scroll-snap-align:start;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:24px;
  transition:transform .3s var(--ease),border-color .3s,box-shadow .3s;
}
.rail .t:hover{transform:translateY(-5px);border-color:var(--blue);box-shadow:0 12px 28px rgba(0,0,0,.35)}
.t header{all:unset;display:flex;align-items:center;gap:14px;margin-bottom:12px}
.t .av{width:52px;height:52px;border-radius:50%;overflow:hidden;flex:none}
.t .av img{width:100%;height:100%;object-fit:cover}
.t h3{font-size:1rem}
.t .star{color:#fbbf24;font-size:.85rem}
.t p{color:var(--mute);font-size:.92rem}

/* Contact */
#contact{background:var(--bg2)}
.contact{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.contact h3{font-size:1.05rem;margin:14px 0 4px;color:var(--cyan)}
.contact h3:first-child{margin-top:0}
.contact .box p{color:var(--mute)}
.contact .intro{text-align:center;color:var(--mute);margin:-28px 0 36px;max-width:72ch;margin-inline:auto}
.links{display:flex;flex-wrap:wrap;gap:10px}
.links a{
  padding:8px 18px;border-radius:999px;border:1px solid var(--line);font-size:.9rem;
  transition:transform .25s var(--ease),background .25s,border-color .25s,box-shadow .25s;
}
.links a:hover{transform:translateY(-3px);background:var(--blue);border-color:var(--blue);box-shadow:0 6px 18px rgba(47,123,255,.35)}
.copy{margin-top:10px;padding:8px 20px;font-size:.9rem}
footer{text-align:center;padding:28px 0;color:var(--mute);font-size:.88rem;border-top:1px solid var(--line);position:relative;z-index:2}

/* Scroll Reveal Classes */
.reveal{
  opacity:0;transform:translateY(34px) scale(.98);
  transition:opacity .75s var(--ease),transform .75s var(--ease);
  transition-delay:var(--d,0ms);
}
.reveal.from-left{transform:translateX(-34px)}
.reveal.from-right{transform:translateX(34px)}
.reveal.show{opacity:1;transform:none}

/* Keyframes */
@keyframes heroIn{to{opacity:1;transform:none}}
@keyframes heroPhotoIn{to{opacity:1;transform:none}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes pulseGlow{
  0%,100%{box-shadow:0 0 48px rgba(47,123,255,.32)}
  50%{box-shadow:0 0 76px rgba(56,189,248,.52)}
}
@keyframes shimmer{to{background-position:200% center}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes drift{
  0%{transform:translate(0,0) scale(1)}
  100%{transform:translate(40px,30px) scale(1.12)}
}

@media(max-width:820px){
  #burger{display:block}
  nav ul{display:none;position:absolute;top:64px;left:0;right:0;flex-direction:column;gap:0;background:rgba(5,9,20,.96);border-bottom:1px solid var(--line)}
  nav ul.open{display:flex;animation:heroIn .25s var(--ease)}
  nav ul a{display:block;padding:14px 20px}
  nav ul a::after{display:none}
  .hero,.about,.offer,.contact{grid-template-columns:1fr}
  .hero{text-align:center}.socials{justify-content:center}
  .hero .photo{order:-1;width:min(260px,70%)}
  .about .photo{margin:0 auto}
  section{padding:60px 0}
}
@media(prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
  .reveal,.hero-anim,.hero-photo-anim{opacity:1!important;transform:none!important}
}
</style>
</head>
<body>

<div id="progressBar" aria-hidden="true"></div>
<div id="cursorGlow" aria-hidden="true"></div>

<header id="siteHeader"><div class="wrap"><nav>
  <a href="#home" class="brand" id="brand"></a>
  <button id="burger" aria-label="Menu">&#9776;</button>
  <ul id="menu">
    <li><a href="#about">About Me</a></li>
    <li><a href="#projects">Projects</a></li>
    <li><a href="#experience">Experience</a></li>
    <li><a href="#certificates">Certificates</a></li>
    <li><a href="#contact">Contact</a></li>
  </ul>
</nav></div></header>

<main>
<section id="home">
  <div class="orb o1" aria-hidden="true"></div>
  <div class="orb o2" aria-hidden="true"></div>
  <div class="wrap hero">
    <div>
      <h3 class="hero-anim d1">Hello, I'm</h3>
      <h1 id="name" class="hero-anim d2"></h1>
      <div class="role hero-anim d3" id="roles"></div>
      <div class="socials hero-anim d4" id="socials"></div>
      <a class="btn hero-anim d5" id="resume1" target="_blank" rel="noopener">Resume</a>
    </div>
    <div class="photo hero-photo-anim" id="heroPhoto"></div>
  </div>
</section>

<section id="about"><div class="wrap about">
  <div class="photo reveal from-left" id="aboutPhoto"></div>
  <div class="reveal from-right" style="--d:120ms">
    <h2 id="aboutTitle"></h2>
    <p id="aboutText"></p>
    <a class="btn" id="resume2" target="_blank" rel="noopener">Resume</a>
  </div>
</div></section>

<section id="projects"><div class="wrap">
  <h2 class="title reveal">My Project</h2>
  <div class="grid" id="projectGrid"></div>
</div></section>

<section id="experience" style="background:var(--bg2)"><div class="wrap">
  <h2 class="title reveal">My Experience</h2>
  <div class="tabs reveal" style="--d:80ms">
    <button class="on" data-tab="exp">Experience</button>
    <button data-tab="edu">Education</button>
  </div>
  <div class="timeline" id="exp"></div>
  <div class="timeline" id="edu" hidden></div>
</div></section>

<section id="certificates"><div class="wrap">
  <h2 class="title reveal">Certificates</h2>
  <div class="grid" id="certGrid"></div>
</div></section>

<section id="offer"><div class="wrap">
  <h2 class="title reveal">My Skill</h2>
  <div class="offer">
    <div class="box reveal" style="--d:0ms"><h3 id="skillTitle"></h3><p id="skillText"></p><ul class="chips" id="skills"></ul></div>
    <div class="box reveal" style="--d:100ms"><h3 id="softTitle"></h3><p id="softText"></p><ul class="chips" id="soft"></ul></div>
    <div class="box reveal" style="--d:200ms"><h3 id="toolTitle"></h3><p id="toolText"></p><ul class="chips" id="tools"></ul></div>
  </div>
</div></section>

<section id="testimonials" style="background:var(--bg2)"><div class="wrap">
  <h2 class="title reveal">What They Say About Me</h2>
  <div class="rail" id="rail"></div>
</div></section>

<section id="contact"><div class="wrap">
  <h2 class="title reveal">Contact Me</h2>
  <p class="intro reveal" id="intro" style="--d:80ms"></p>
  <div class="contact">
    <div class="box reveal from-left" style="--d:120ms">
      <h3>Email</h3><p id="email"></p>
      <button class="btn copy" id="copyBtn">Copy Email</button>
      <h3>Location</h3><p id="loc"></p>
      <h3>Social Media</h3><div class="links" id="cSocials"></div>
    </div>
    <div class="box reveal from-right" style="--d:200ms">
      <h3>Write Me &amp; We'll Talk</h3>
      <div class="links" id="cMsg" style="margin-top:10px"></div>
    </div>
  </div>
</div></section>
</main>

<footer id="footer"></footer>

<script>
/* =====================================================
   EDIT HERE ONLY. Semua isi portfolio ada di objek DATA.
   Kosongkan "" untuk gambar/link yang belum ada.
   Taruh gambar di folder assets/img/ lalu isi path-nya.
   ===================================================== */
const DATA = {
  brand: "Sin's PORTOFOLIO",
  name: "SINDARA SEKAR PRAMESWARI",
  roles: ["Computer Engineering", "FT UNNES", ""],
  photo: "pfp.png",                       // contoh: "assets/img/hero.png"
  aboutPhoto: "about.png",                // contoh: "assets/img/about.png"
  resume: "",                             // contoh: "assets/pdf/CV-Nama.pdf"
  socials: [
    { label: "LinkedIn",  url: "https://linkedin.com/in/sindara-prameswari-080764320/" },
    { label: "Tiktok",    url: "https://tiktok.com/@sindchannn" },
    { label: "Instagram", url: "https://instagram.com/sindaraaskr" }
  ],

};

/* ---------- Animations & Interactions ---------- */
// 1. Scroll Reveal
const revealObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('show');
      revealObserver.unobserve(entry.target);
    }
  });
}, { threshold: 0.08, rootMargin: '0px 0px -36px 0px' });

const observeReveals = (root = document) => {
  root.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));
};
observeReveals();

// 2. Experience / Education Tabs with Smooth Re-reveal
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  const targetId = b.dataset.tab;
  $('exp').hidden = targetId !== 'exp';
  $('edu').hidden = targetId !== 'edu';
  const activeList = $(targetId);
  activeList.querySelectorAll('.reveal').forEach(el => {
    el.classList.remove('show');
    revealObserver.observe(el);
  });
});

// 3. Scroll Progress Bar & Navbar Active State
const progressBar = $('progressBar');
const siteHeader = $('siteHeader');
const navLinks = [...document.querySelectorAll('#menu a')];
const sections = navLinks.map(a => document.querySelector(a.getAttribute('href'))).filter(Boolean);

const onScroll = () => {
  const y = window.scrollY;
  const max = document.documentElement.scrollHeight - window.innerHeight;
  progressBar.style.width = max > 0 ? (y / max * 100) + '%' : '0%';
  siteHeader.classList.toggle('scrolled', y > 24);

  let current = '';
  sections.forEach(sec => {
    if (y >= sec.offsetTop - 140) current = '#' + sec.id;
  });
  navLinks.forEach(a => a.classList.toggle('active', a.getAttribute('href') === current));
};
window.addEventListener('scroll', onScroll, { passive: true });
onScroll();

// 4. Cursor Spotlight & Subtle 3D Card Tilt (Desktop Only)
if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
  const glow = $('cursorGlow');
  window.addEventListener('pointermove', e => {
    glow.style.setProperty('--mx', e.clientX + 'px');
    glow.style.setProperty('--my', e.clientY + 'px');
  }, { passive: true });

  document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('pointermove', e => {
      const r = card.getBoundingClientRect();
      const x = e.clientX - r.left;
      const y = e.clientY - r.top;
      const rx = ((y / r.height) - 0.5) * -7;
      const ry = ((x / r.width) - 0.5) * 7;
      card.style.setProperty('--cx', x + 'px');
      card.style.setProperty('--cy', y + 'px');
      card.style.transform = `perspective(900px) rotateX(${rx}deg) rotateY(${ry}deg) translateY(-5px)`;
    });
    card.addEventListener('pointerleave', () => {
      card.style.transform = '';
    });
  });
}
